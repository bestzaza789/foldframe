<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 440px; height: 280px; overflow: hidden; position: relative;
    background: radial-gradient(120% 140% at 100% 0%, #2a3378 0%, #12152a 55%, #0b0d17 100%);
    font-family: "Inter", "Segoe UI", system-ui, sans-serif; color: #fff; }
  .copy { position: absolute; left: 30px; top: 40px; width: 200px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
  .brand img { width: 34px; height: 34px; }
  h1 { margin: 22px 0 10px; font-size: 26px; line-height: 1.08; letter-spacing: -.03em; }
  p { margin: 0; color: #aab3d6; font-size: 13px; line-height: 1.45; }
  .dev { position: absolute; background: #08080a; border-radius: 22px; padding: 6px; box-shadow: inset 0 0 0 1.5px #33363e, 0 20px 40px rgba(0,0,0,.5); }
  .dev i { display: block; width: 100%; height: 100%; border-radius: 17px; background: linear-gradient(160deg, #f7f1ea 0 48%, #d98a4f 48% 72%, #f7f1ea 72%); }
  .fold { right: -40px; top: 40px; width: 190px; height: 150px; }
  .fold::after { content: ""; position: absolute; left: 50%; top: 6px; bottom: 6px; width: 1px; background: rgba(0,0,0,.18); }
  .phone { right: 92px; top: 124px; width: 78px; height: 164px; transform: rotate(-6deg); }
</style></head>
<body>
  <div class="copy">
    <div class="brand"><img src="icon.png" alt="">Foldframe</div>
    <h1>Every phone.<br>Every fold.</h1>
    <p>Preview any site on phones, tablets and foldables in one click.</p>
  </div>
  <div class="dev fold"><i></i></div>
  <div class="dev phone"><i></i></div>
</body></html>
