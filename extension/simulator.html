<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foldframe</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="simulator.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="4" y="6" width="11" height="20" rx="3" fill="currentColor"/>
        <path d="M17.5 7.2 26 5.2c1.1-.3 2 .5 2 1.6v18.4c0 1.1-.9 1.9-2 1.6l-8.5-2a2 2 0 0 1-1.5-1.9V9.1c0-.9.6-1.7 1.5-1.9Z" fill="currentColor" opacity=".55"/>
      </svg>
      <span>Foldframe</span>
    </div>

    <form class="url" id="urlForm" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="url" type="text" spellcheck="false">
      <button type="button" id="reload" class="icon-btn" aria-label="Reload">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M19 4v4h-4"/></svg>
      </button>
    </form>

    <div class="controls">
      <label class="select">
        <select id="device" aria-label="Device"></select>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </label>

      <span id="customBox" class="custom" hidden>
        <input id="cw" type="number" min="200" max="3000" aria-label="Width">
        <span>×</span>
        <input id="ch" type="number" min="200" max="3000" aria-label="Height">
      </span>

      <div class="seg" id="foldSeg" role="group" hidden>
        <button type="button" data-fold="0">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M12 5v14" stroke-dasharray="2 2"/></svg>
          <span data-t="unfolded"></span>
        </button>
        <button type="button" data-fold="1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="4" width="10" height="16" rx="2.5"/></svg>
          <span data-t="folded"></span>
        </button>
      </div>

      <div class="seg" id="orientSeg" role="group">
        <button type="button" data-orient="portrait">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2.5"/></svg>
          <span data-t="portrait"></span>
        </button>
        <button type="button" data-orient="landscape">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2.5"/></svg>
          <span data-t="landscape"></span>
        </button>
      </div>

      <div class="seg" id="zoomSeg" role="group">
        <button type="button" data-zoom="fit" data-t="fit"></button>
        <button type="button" data-zoom="100" data-t="actual"></button>
      </div>

      <span id="info" class="chip"></span>
    </div>
  </header>

  <main id="stage">
    <div id="scaler">
      <div id="device-frame" class="device">
        <span class="btn btn-power"></span>
        <span class="btn btn-vol"></span>
        <div class="statusbar" id="statusbar">
          <span class="time" id="clock">9:41</span>
          <span class="cam"></span>
          <span class="sys">
            <svg viewBox="0 0 18 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx=".7"/><rect x="5" y="5.5" width="3" height="6.5" rx=".7"/><rect x="10" y="3" width="3" height="9" rx=".7"/><rect x="15" y="0" width="3" height="12" rx=".7"/></svg>
            <svg viewBox="0 0 26 12" aria-hidden="true"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.6"/><rect x="23" y="4" width="1.8" height="4" rx=".9" opacity=".5"/></svg>
          </span>
        </div>
        <div class="screen" id="screen">
          <iframe id="frame" title="Preview"></iframe>
          <div class="crease" id="crease"></div>
          <div class="overlay" id="empty">
            <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="11" height="20" rx="3"/><path d="M17.5 7.2 26 5.2c1.1-.3 2 .5 2 1.6v18.4c0 1.1-.9 1.9-2 1.6l-8.5-2a2 2 0 0 1-1.5-1.9V9.1c0-.9.6-1.7 1.5-1.9Z" opacity=".55"/></svg>
            <h2 data-t="emptyTitle"></h2>
            <p data-t="emptyBody"></p>
          </div>
          <div class="overlay" id="gate" hidden>
            <h2 id="gateTitle"></h2>
            <p data-t="gateBody"></p>
            <button type="button" id="gateAllow" class="primary" data-t="gateAllow"></button>
            <p class="err" id="gateErr" hidden></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="devices.js"></script>
  <script src="i18n.js"></script>
  <script src="simulator.js"></script>
</body>
</html>
